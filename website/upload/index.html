<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload &mdash; RSDWBuilds.com</title>
  <meta name="description" content="Approved contributor upload queue for RSDWBuilds.com submissions." />
  <link rel="apple-touch-icon" sizes="180x180" href="/shared/assets/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/shared/assets/favicon_io/favicon-16x16.png" />
  <link rel="icon" href="/shared/assets/favicon_io/favicon.ico" />
  <link rel="manifest" href="/shared/assets/favicon_io/site.webmanifest" />
  <link rel="preload" href="https://fonts.gstatic.com/s/sofiasans/v20/Yq6T-LCVXSLy9uPBwlATrORKkzApcb8.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/shared/site-shell.css" />
  <link rel="stylesheet" href="/shared/staging.css" />
  <link rel="stylesheet" href="/shared/upload.css" />
</head>
<body data-tool="upload">
  <div id="rsdw-header-mount"></div>

  <main class="rsdw-staging rsdw-upload">
    <header class="rsdw-staging__head">
      <h1>Upload a Submission</h1>
      <p>
        Sign in with GitHub, choose a packaged <code>.zip</code>, and send it
        into the publishing queue.
      </p>
    </header>

    <section class="rsdw-staging__form rsdw-upload__auth" aria-live="polite">
      <div id="rsdw-upload-signed-out" class="rsdw-upload__auth-state">
        <div class="rsdw-upload__auth-copy">
          <strong>Contributor access</strong>
          <span>Use an approved GitHub account.</span>
        </div>
        <button type="button" id="rsdw-upload-login" class="rsdw-btn rsdw-btn--primary">
          Sign in with GitHub
        </button>
      </div>

      <div id="rsdw-upload-signed-in" class="rsdw-upload__auth-state rsdw-upload__user" hidden>
        <img id="rsdw-upload-avatar" class="rsdw-upload__avatar" alt="" />
        <div class="rsdw-upload__user-text">
          <strong id="rsdw-upload-name">Signed in</strong>
          <span id="rsdw-upload-username"></span>
        </div>
        <button type="button" id="rsdw-upload-logout" class="rsdw-btn">Sign out</button>
      </div>
    </section>

    <section id="rsdw-upload-panel" class="rsdw-staging__form rsdw-upload__panel" hidden>
      <header class="rsdw-upload__panel-head">
        <h2>Submission package</h2>
        <p>Use the zip generated by the Submit page.</p>
      </header>

      <fieldset class="rsdw-field">
        <label>Submission zip <span class="rsdw-req">*</span></label>
        <small>One packaged build or prefab zip, up to 25 MB.</small>
        <div id="rsdw-upload-drop" class="rsdw-drop" tabindex="0">
          <p class="rsdw-drop__label">
            Drop a zip here, or
            <button type="button" class="rsdw-drop__btn" id="rsdw-upload-pick">choose a file</button>
          </p>
          <input id="rsdw-upload-file" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden />
        </div>
        <ul id="rsdw-upload-file-list" class="rsdw-filelist" aria-label="Selected upload"></ul>
      </fieldset>

      <div id="rsdw-upload-issues" class="rsdw-issues" hidden></div>

      <div class="rsdw-staging__actions">
        <button type="button" id="rsdw-upload-submit" class="rsdw-btn rsdw-btn--primary" disabled>
          Upload
        </button>
      </div>

      <div id="rsdw-upload-status" class="rsdw-upload__status" role="status" hidden></div>
    </section>
  </main>

  <div id="rsdw-footer-mount"></div>

  <script src="/shared/shared-header.js" defer></script>
  <script type="module" src="/shared/upload.js"></script>
</body>
</html>
