name: Process Uploaded Submissions

on:
  workflow_dispatch:
    inputs:
      submission_path:
        description: Uploaded zip path
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: process-submissions
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process submissions
        run: python tools/process_submissions.py

      - name: Commit processed site data
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No processed changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/incoming website/data
          git commit -m "Publish uploaded submissions"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
